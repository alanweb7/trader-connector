version: "3.7"

# =============================================================================
# Deploy no Portainer:
#   1) Stacks -> Update (ou Add stack) -> cole este arquivo no Web editor
#   2) Em "Environment variables", cole o conteudo de .env.portainer
#      (ou use o botao "Load variables from file" apontando para ele)
#   3) Update the stack
#
# NENHUM valor fica neste arquivo — so ${VAR}. O arquivo .env.portainer
# (gitignored) contem os valores e vai para o painel de env do Portainer.
# =============================================================================

services:
  broker-gateway:
    image: ghcr.io/alanweb7/trader-connector:latest
    container_name: broker-gateway
    restart: unless-stopped
    # SEM porta publicada de proposito:
    # - "8000:8000" expunha o gateway direto na internet (risco) e fazia o
    #   Traefik (provedor swarm) escolher o IP da rede `ingress` como alvo,
    #   inalcancavel de dentro dos containers -> 504 em todo /health.
    # Acesso externo somente via Traefik (connector.ticketpay.app.br).
    # Para debug local temporario: - "127.0.0.1:8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - IQOPTION_EMAIL=${IQOPTION_EMAIL}
      - IQOPTION_PASSWORD=${IQOPTION_PASSWORD}
      - IQOPTION_ACCOUNT_TYPE=${IQOPTION_ACCOUNT_TYPE:-practice}
      - PORT=${PORT:-8000}
      - HOST=${HOST:-0.0.0.0}
      # Poll do worker de ordens agendadas. A 1s gerava ~86k req/dia no
      # Supabase e estourava a quota de logs do plano gratuito.
      # Efeito colateral: ordens agendadas disparam com atraso de ate 50s.
      - SCHEDULED_POLL_SEC=${SCHEDULED_POLL_SEC:-50}
      # Agendamento de ordens: desligado por enquanto (fila vazia). Para reativar
      # na fase de maturacao, mude para 1 no .env.portainer.
      - SCHEDULED_ORDERS_ENABLED=${SCHEDULED_ORDERS_ENABLED:-0}
    networks:
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - "traefik.http.routers.broker-gateway.rule=Host(`connector.ticketpay.app.br`)"
        - traefik.http.services.broker-gateway.loadbalancer.server.port=8000
        - traefik.http.routers.broker-gateway.service=broker-gateway
        - traefik.http.routers.broker-gateway.tls.certresolver=letsencryptresolver
        - traefik.http.routers.broker-gateway.tls=true
        - traefik.http.routers.broker-gateway.entrypoints=websecure

networks:
  traefik_public:
    name: traefik_public
    external: true
