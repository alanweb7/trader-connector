version: '3.8'

services:
  broker-gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      # Credenciais de corretora são injetadas em runtime pelo frontend via
      # POST /connections. Não usar IQOPTION_*/AVALON_* aqui.
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3