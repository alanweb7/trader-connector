version: '3.8'

services:
  broker-gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - IQOPTION_EMAIL=${IQOPTION_EMAIL}
      - IQOPTION_PASSWORD=${IQOPTION_PASSWORD}
      - IQOPTION_ACCOUNT_TYPE=${IQOPTION_ACCOUNT_TYPE:-practice}
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3